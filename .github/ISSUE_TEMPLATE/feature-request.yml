name: Чего-то не хватает
description: Предложение добавить проверку, исправление или изменить поведение
title: "[Предложение] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Предложения приветствуются. Программа открытая, и многое из того, что в ней
        есть, появилось именно из таких сообщений.

        Одно уточнение, чтобы не тратить ваше время: в программе сознательно нет
        чистки реестра, установки драйверов, отключения антивируса и обещаний
        по FPS. Почему — написано в описании. Если предложение про это, я объясню
        причину отказа, но делать не буду.

  - type: textarea
    id: problem
    attributes:
      label: Какая задача не решается сейчас
      description: |
        Начните с проблемы, а не с готового решения. Так я лучше пойму, что нужно.
      placeholder: |
        У меня два монитора, и игра иногда открывается на неправильном.
        Программа этого не замечает, а я каждый раз переставляю вручную.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Как это могло бы выглядеть
      description: Если есть представление — опишите. Если нет, оставьте пустым.
      placeholder: Проверка, которая смотрит, на каком мониторе запускается игра.

  - type: textarea
    id: report
    attributes:
      label: Файл отчёта (по желанию)
      description: Если предложение связано с тем, что показала программа — приложите отчёт, так понятнее.
      placeholder: Перетащите файл сюда.

  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Я поискал среди уже открытых предложений — похожего не нашёл
          required: true
